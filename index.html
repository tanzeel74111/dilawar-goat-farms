<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DILAWAR GOAT FARMS</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    /* Image zoom modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.9);
      overflow: auto;
      touch-action: none;
    }
    
    .modal-content-container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      position: relative;
    }
    
    .modal-content {
      max-width: 90%;
      max-height: 90vh;
      object-fit: contain;
      transition: transform 0.3s;
      transform-origin: center center;
      cursor: grab;
    }
    
    .modal-content.grabbing {
      cursor: grabbing;
    }
    
    .close {
      position: absolute;
      top: 20px;
      right: 35px;
      color: white;
      font-size: 40px;
      font-weight: bold;
      transition: 0.3s;
      cursor: pointer;
      z-index: 101;
    }
    
    .close:hover {
      color: #bbb;
    }
    
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      background: rgba(0,0,0,0.5);
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      z-index: 101;
      user-select: none;
    }
    
    .prev {
      left: 20px;
    }
    
    .next {
      right: 20px;
    }
    
    .caption {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: white;
      padding: 10px 20px;
      background: rgba(0,0,0,0.5);
      margin: 0 auto;
      max-width: 80%;
      border-radius: 5px;
    }
    
    .zoom-indicator {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 14px;
      z-index: 101;
    }
  </style>
</head>

<body class="bg-gray-100 text-gray-800">
  <!-- Image Zoom Modal -->
  <div id="imageModal" class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <div class="zoom-indicator" id="zoomIndicator">100%</div>
    <div class="modal-content-container">
      <div class="nav-btn prev" onclick="navigate(-1)">&#10094;</div>
      <img class="modal-content" id="zoomedImage">
      <div class="nav-btn next" onclick="navigate(1)">&#10095;</div>
      <div id="caption" class="caption"></div>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-green-900 text-white p-4 shadow">
    <div class="container mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-4">
        <img src="logo.jpg" alt="Farm Logo" class="h-12 w-12 rounded-full object-contain cursor-pointer hover:opacity-90" 
             onclick="zoomImage(this, 'logo')" />
        <h1 class="text-3xl font-bold">DILAWAR GOAT FARMS</h1>
      </div>
      <nav>
        <ul class="flex space-x-4">
          <li><a href="#about" class="hover:underline">About</a></li>
          <li><a href="#livestock" class="hover:underline">Livestock</a></li>
          <li><a href="#gallery" class="hover:underline">Gallery</a></li>
          <li><a href="#services" class="hover:underline">Services</a></li>
          <li><a href="#testimonials" class="hover:underline">Testimonials</a></li>
          <li><a href="#contact" class="hover:underline">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Rest of your HTML remains the same until the JavaScript section -->

  <!-- JavaScript -->
  <script>
    // Global variables
    let currentImageIndex = 0;
    let currentImageSet = [];
    let currentScale = 1;
    let startX, startY, startDistance;
    let isDragging = false;
    let startPos = { x: 0, y: 0 };
    let offset = { x: 0, y: 0 };
    let currentTransform = { x: 0, y: 0, scale: 1 };

    // Toggle gallery function
    function toggleGallery() {
      const gallery = document.getElementById("makhichiniGallery");
      const button = document.querySelector("button[onclick='toggleGallery()']");
      
      gallery.classList.toggle("hidden");
      
      if (gallery.classList.contains("hidden")) {
        button.textContent = "View More Images ↓";
      } else {
        button.textContent = "Hide Images ↑";
      }
    }

    // Image zoom functionality
    function zoomImage(img, galleryType) {
      const modal = document.getElementById("imageModal");
      const modalImg = document.getElementById("zoomedImage");
      const captionText = document.getElementById("caption");
      const zoomIndicator = document.getElementById("zoomIndicator");
      
      // Set current image set based on gallery type
      if (galleryType === 'makhichini') {
        currentImageSet = Array.from(document.querySelectorAll('#livestock img[src^="images/makhichini"]'));
      } else if (galleryType === 'gallery') {
        currentImageSet = Array.from(document.querySelectorAll('#gallery img'));
      } else if (galleryType === 'logo') {
        currentImageSet = [img]; // Only the logo image
      }
      
      // Find current image index
      currentImageIndex = currentImageSet.findIndex(image => image.src === img.src);
      
      // Reset zoom and position
      currentScale = 1;
      currentTransform = { x: 0, y: 0, scale: 1 };
      updateImageTransform();
      zoomIndicator.textContent = "100%";
      
      // Show image
      modalImg.src = img.src;
      captionText.innerHTML = img.alt;
      modal.style.display = "block";
      document.body.style.overflow = "hidden";
    }

    // Navigation between images
    function navigate(direction) {
      // Don't navigate if we're viewing the logo (single image)
      if (currentImageSet.length <= 1) return;
      
      currentImageIndex += direction;
      
      // Wrap around if at beginning or end
      if (currentImageIndex < 0) {
        currentImageIndex = currentImageSet.length - 1;
      } else if (currentImageIndex >= currentImageSet.length) {
        currentImageIndex = 0;
      }
      
      const modalImg = document.getElementById("zoomedImage");
      const captionText = document.getElementById("caption");
      
      // Reset zoom and position when changing images
      currentScale = 1;
      currentTransform = { x: 0, y: 0, scale: 1 };
      updateImageTransform();
      document.getElementById("zoomIndicator").textContent = "100%";
      
      modalImg.src = currentImageSet[currentImageIndex].src;
      captionText.innerHTML = currentImageSet[currentImageIndex].alt;
    }

    // Rest of your JavaScript remains the same...
    function closeModal() {
      document.getElementById("imageModal").style.display = "none";
      document.body.style.overflow = "auto";
    }

    function updateImageTransform() {
      const modalImg = document.getElementById("zoomedImage");
      modalImg.style.transform = `translate(${currentTransform.x}px, ${currentTransform.y}px) scale(${currentTransform.scale})`;
    }

    document.addEventListener('DOMContentLoaded', function() {
      const modalImg = document.getElementById("zoomedImage");
      const modal = document.getElementById("imageModal");
      
      if (!modalImg) return;
      
      // Mouse events
      modalImg.addEventListener('mousedown', function(e) {
        if (currentTransform.scale <= 1) return;
        
        isDragging = true;
        startPos = {
          x: e.clientX - currentTransform.x,
          y: e.clientY - currentTransform.y
        };
        modalImg.classList.add('grabbing');
        e.preventDefault();
      });
      
      window.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        
        currentTransform.x = e.clientX - startPos.x;
        currentTransform.y = e.clientY - startPos.y;
        updateImageTransform();
      });
      
      window.addEventListener('mouseup', function() {
        isDragging = false;
        modalImg.classList.remove('grabbing');
      });
      
      // Touch events for pinch zoom
      modalImg.addEventListener('touchstart', function(e) {
        if (e.touches.length === 2) {
          // Pinch start
          startDistance = getDistance(
            { x: e.touches[0].clientX, y: e.touches[0].clientY },
            { x: e.touches[1].clientX, y: e.touches[1].clientY }
          );
          startX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          startY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          offset.x = currentTransform.x;
          offset.y = currentTransform.y;
        } else if (e.touches.length === 1 && currentTransform.scale > 1) {
          // Drag start
          isDragging = true;
          startPos = {
            x: e.touches[0].clientX - currentTransform.x,
            y: e.touches[0].clientY - currentTransform.y
          };
        }
      });
      
      modalImg.addEventListener('touchmove', function(e) {
        if (e.touches.length === 2) {
          // Pinch move
          const distance = getDistance(
            { x: e.touches[0].clientX, y: e.touches[0].clientY },
            { x: e.touches[1].clientX, y: e.touches[1].clientY }
          );
          
          const newScale = Math.max(1, Math.min(3, currentScale * (distance / startDistance)));
          const scaleChange = newScale / currentTransform.scale;
          
          currentTransform.scale = newScale;
          currentScale = newScale;
          
          // Calculate new position to zoom toward touch point
          const currentX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          const currentY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          
          currentTransform.x = currentX - (currentX - offset.x) * scaleChange;
          currentTransform.y = currentY - (currentY - offset.y) * scaleChange;
          
          updateImageTransform();
          document.getElementById("zoomIndicator").textContent = `${Math.round(currentScale * 100)}%`;
          
          startDistance = distance;
          offset.x = currentTransform.x;
          offset.y = currentTransform.y;
        } else if (e.touches.length === 1 && isDragging) {
          // Drag move
          currentTransform.x = e.touches[0].clientX - startPos.x;
          currentTransform.y = e.touches[0].clientY - startPos.y;
          updateImageTransform();
        }
      });
      
      modalImg.addEventListener('touchend', function() {
        isDragging = false;
      });
      
      // Mouse wheel zoom
      modal.addEventListener('wheel', function(e) {
        e.preventDefault();
        
        const rect = modalImg.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const delta = -e.deltaY;
        const zoomIntensity = 0.1;
        
        const newScale = Math.max(1, Math.min(3, currentTransform.scale + delta * zoomIntensity * 0.01));
        const scaleChange = newScale / currentTransform.scale;
        
        currentTransform.scale = newScale;
        currentScale = newScale;
        
        // Adjust position to zoom toward mouse position
        currentTransform.x = mouseX - (mouseX - currentTransform.x) * scaleChange;
        currentTransform.y = mouseY - (mouseY - currentTransform.y) * scaleChange;
        
        updateImageTransform();
        document.getElementById("zoomIndicator").textContent = `${Math.round(currentScale * 100)}%`;
      });
    });
    
    // Helper function to calculate distance between two points
    function getDistance(p1, p2) {
      return Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
    }

    // Close modal when clicking outside the image
    window.onclick = function(event) {
      const modal = document.getElementById("imageModal");
      if (event.target == modal) {
        closeModal();
      }
    }

    // Close modal with Escape key
    document.onkeydown = function(evt) {
      evt = evt || window.event;
      if (evt.key === "Escape") {
        closeModal();
      }
    };
  </script>
</body>

</html>
